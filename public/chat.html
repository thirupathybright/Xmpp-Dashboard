<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBI Messenger Web</title>
<style>
  :root {
    --page-1: #e9e8fb; --page-2: #f3e8fb;
    --panel: #ffffff; --panel-2: #f6f8fa; --line: #e8ecf0;
    --text: #0f1b24; --text-dim: #66737f; --text-faint: #98a4ae;
    --accent: #4f46e5; --accent-2: #7c5cf0; --accent-soft: #ecebfd; --accent-text: #ffffff;
    --out-a: #4f46e5; --out-b: #7c5cf0; --out-text: #ffffff;
    --in: #ffffff; --in-border: #e8ecf0;
    --chat-bg: #f5f5fb; --dot: rgba(15, 27, 36, .06);
    --hover: #f4f4fa; --active: #ecebfd;
    --unread: #4f46e5; --danger: #d0304a; --link: #0b73b8;
    --shadow: 0 20px 60px -20px rgba(15, 27, 36, .25), 0 2px 8px rgba(15, 27, 36, .06);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-1: #12102b; --page-2: #1a0f2b;
      --panel: #14152a; --panel-2: #1c1d36; --line: #282a46;
      --text: #eceefb; --text-dim: #9396b8; --text-faint: #646889;
      --accent: #8b8cff; --accent-2: #b08cff; --accent-soft: #24234a; --accent-text: #0e0d2a;
      --out-a: #5b52e8; --out-b: #7d5cf0; --out-text: #ffffff;
      --in: #1e2040; --in-border: #2c2f52;
      --chat-bg: #0e0f1d; --dot: rgba(255, 255, 255, .045);
      --hover: #191a2e; --active: #222346;
      --unread: #8b8cff; --link: #6cc4f5;
      --shadow: 0 20px 60px -20px rgba(0, 0, 0, .7), 0 2px 8px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(900px 600px at 10% 0%, var(--page-1), transparent 60%),
                radial-gradient(900px 600px at 100% 100%, var(--page-2), transparent 60%),
                var(--chat-bg);
    color: var(--text); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  .app {
    display: flex; height: calc(100dvh - 32px); margin: 16px auto; max-width: 1480px; width: calc(100% - 32px);
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--line); overflow: hidden;
  }

  /* ---- sidebar ---- */
  .side { width: 392px; min-width: 310px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  .side-head { padding: 18px 16px 10px; display: flex; align-items: center; gap: 12px; }
  .side-head .me { flex: 1; min-width: 0; line-height: 1.25; }
  .side-head .me b { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-head .me small { color: var(--text-dim); font-size: 12.5px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--text-dim); transition: background .15s, color .15s, transform .1s; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 21px; height: 21px; fill: currentColor; }
  .icon-btn.accent { background: var(--accent-soft); color: var(--accent); }
  .icon-btn.accent:hover { background: var(--accent); color: var(--accent-text); }
  .search { padding: 6px 16px 12px; position: relative; }
  .search svg { position: absolute; left: 30px; top: 50%; transform: translateY(-62%); width: 18px; height: 18px; fill: var(--text-faint); pointer-events: none; }
  .search input { width: 100%; height: 42px; border: 1px solid transparent; border-radius: 14px; background: var(--panel-2); color: var(--text); padding: 0 16px 0 42px; font: inherit; transition: border-color .15s, background .15s, box-shadow .15s; }
  .search input:focus { outline: none; background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .search input::placeholder { color: var(--text-faint); }
  .list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
  .list-label { padding: 14px 12px 6px; font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
  .conv { display: flex; gap: 13px; align-items: center; width: 100%; padding: 10px 12px; text-align: left; border-radius: 16px; transition: background .12s; }
  .conv:hover { background: var(--hover); }
  .conv.active { background: var(--active); }
  .conv .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .conv .row { display: flex; align-items: center; gap: 8px; }
  .conv .name { flex: 1; font-size: 15px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .time { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .conv .time.unread { color: var(--accent); font-weight: 600; }
  .conv .last { flex: 1; font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { min-width: 21px; height: 21px; padding: 0 7px; border-radius: 11px; background: var(--accent); color: var(--accent-text); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
  .empty { padding: 40px 24px; text-align: center; color: var(--text-dim); line-height: 1.5; }

  .avatar { flex: none; width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 19px; text-transform: uppercase; box-shadow: inset 0 -10px 20px rgba(0,0,0,.1); }
  .avatar.sm { width: 42px; height: 42px; border-radius: 14px; font-size: 16px; }

  /* ---- chat pane ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
  .welcome { flex: 1; display: grid; place-items: center; text-align: center; padding: 32px; color: var(--text-dim); background:
    radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 22px 22px, var(--chat-bg); }
  .welcome .art { width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 30px; display: grid; place-items: center; background: linear-gradient(145deg, var(--accent), var(--accent-2)); box-shadow: 0 18px 40px -14px var(--accent); }
  .welcome .art svg { width: 44px; height: 44px; fill: #fff; }
  .welcome h2 { font-weight: 700; font-size: 24px; letter-spacing: -.02em; color: var(--text); margin-bottom: 8px; }
  .welcome p { max-width: 320px; margin: 0 auto; line-height: 1.55; }
  .chat { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .main.open .chat { display: flex; }
  .main.open .welcome { display: none; }
  .chat-head { flex: none; padding: 12px 18px; display: flex; align-items: center; gap: 13px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chat-head .who { flex: 1; min-width: 0; line-height: 1.3; }
  .chat-head .who b { display: block; font-weight: 650; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .who small { color: var(--text-dim); font-size: 12.5px; }
  .back { display: none; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px min(7%, 72px) 10px; display: flex; flex-direction: column; gap: 3px;
    background: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0) 0 0 / 22px 22px, var(--chat-bg); }
  .day { align-self: center; margin: 14px 0 8px; padding: 5px 13px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--text-dim); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
  .older { align-self: center; margin: 4px 0 8px; padding: 7px 16px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; transition: filter .15s; }
  .older:hover { filter: brightness(.96); }
  .bubble { max-width: min(74%, 580px); padding: 8px 12px 7px; border-radius: 18px; position: relative; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.45; font-size: 14.5px; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
  .bubble.in { align-self: flex-start; background: var(--in); border: 1px solid var(--in-border); border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(15,27,36,.04); }
  .bubble.out { align-self: flex-end; background: linear-gradient(135deg, var(--out-a), var(--out-b)); color: var(--out-text); border-bottom-right-radius: 6px; box-shadow: 0 6px 16px -8px var(--out-a); }
  .bubble.gap { margin-top: 9px; }
  .bubble .who-name { display: block; font-size: 12.5px; font-weight: 650; margin-bottom: 3px; }
  .bubble .t { float: right; margin: 9px 0 -3px 14px; font-size: 10.5px; color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bubble.out .t { color: rgba(255,255,255,.78); }
  .bubble.pending { opacity: .7; }
  .bubble.failed { box-shadow: 0 0 0 2px var(--danger); }
  .bubble.failed .t { color: #ffd7de; font-weight: 600; }
  .bubble a { color: var(--link); text-underline-offset: 2px; }
  .bubble.out a { color: #fff; }
  .bubble img, .bubble video { display: block; max-width: 100%; max-height: 360px; border-radius: 12px; margin: 2px 0 6px; cursor: zoom-in; background: var(--panel-2); }
  .bubble audio { display: block; max-width: 100%; margin-bottom: 4px; }
  .file-card { display: flex; gap: 12px; align-items: center; padding: 10px 12px; margin-bottom: 4px; border-radius: 12px; background: rgba(127,127,127,.12); text-decoration: none; color: inherit !important; white-space: normal; }
  .file-card svg { width: 28px; height: 28px; fill: currentColor; opacity: .7; flex: none; }
  .file-card span { overflow-wrap: anywhere; font-weight: 500; }

  .composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--chat-bg); }
  .composer .field { flex: 1; display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(15,27,36,.05); transition: border-color .15s, box-shadow .15s; }
  .composer .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .composer textarea { flex: 1; resize: none; max-height: 140px; min-height: 40px; border: 0; background: transparent; color: var(--text); padding: 10px 6px; font: inherit; line-height: 1.35; }
  .composer textarea:focus { outline: none; }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer .icon-btn { border-radius: 50%; }
  .send { width: 48px; height: 48px; border-radius: 50% !important; background: linear-gradient(145deg, var(--accent), var(--accent-2)) !important; color: var(--accent-text) !important; box-shadow: 0 8px 18px -8px var(--accent); }
  .send:hover { filter: brightness(1.06); }
  .send svg { width: 22px; height: 22px; }
  .toast { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(6px); background: var(--text); color: var(--panel); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .toast.show { opacity: .96; transform: translateX(-50%); }
  .lightbox { position: fixed; inset: 0; background: rgba(5, 10, 14, .9); backdrop-filter: blur(6px); display: none; place-items: center; z-index: 10; padding: 24px; cursor: zoom-out; }
  .lightbox.show { display: grid; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .conn { display: none; margin: 0 16px 8px; padding: 8px 14px; border-radius: 12px; background: #fff3cd; color: #664d03; font-size: 12.5px; font-weight: 500; text-align: center; }
  .conn.show { display: block; }

  @media (max-width: 760px) {
    .app { height: 100dvh; margin: 0; width: 100%; max-width: none; border-radius: 0; border: 0; box-shadow: none; }
    .side { width: 100%; min-width: 0; border-right: 0; }
    .main { display: none; position: fixed; inset: 0; z-index: 2; }
    .app.in-chat .main { display: flex; }
    .app.in-chat .side { display: none; }
    .back { display: grid; margin-left: -6px; }
    .chat-head { padding: 10px 12px; }
    .msgs { padding: 14px 12px 8px; }
    .bubble { max-width: 86%; }
    .composer { padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="avatar sm" id="meAvatar" aria-hidden="true"></div>
      <div class="me"><b id="meName">…</b><small id="meJid"></small></div>
      <button class="icon-btn accent" id="newChatBtn" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24"><path d="M19.005 3.175H4.674C3.642 3.175 3 3.789 3 4.821V21.02l3.544-3.514h12.461c1.033 0 2.064-1.06 2.064-2.093V4.821c-.001-1.032-1.032-1.646-2.064-1.646zm-4.989 9.869H7.041V11.1h6.975v1.944zm3-4H7.041V7.1h9.975v1.944z"/></svg>
      </button>
      <form method="POST" action="/logout">
        <button class="icon-btn" title="Sign out" aria-label="Sign out" type="submit">
          <svg viewBox="0 0 24 24"><path d="M16 17v-3H9v-4h7V7l5 5-5 5zM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
        </button>
      </form>
    </div>
    <div class="conn" id="conn">Reconnecting…</div>
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="search" type="search" placeholder="Search or start a new chat" autocomplete="off" aria-label="Search chats"></div>
    <div class="list" id="list" role="list"></div>
  </aside>

  <section class="main" id="main">
    <div class="welcome">
      <div>
        <div class="art" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 1-2zm3 5v2h10V9H7zm0 3.5v2h6v-2H7z"/></svg></div>
        <h2>TBI Messenger Web</h2>
        <p>Pick a conversation from the list to read and reply. Your phone doesn't need to stay online.</p>
      </div>
    </div>
    <div class="chat">
      <div class="chat-head">
        <button class="icon-btn back" id="backBtn" aria-label="Back to chats">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="avatar sm" id="peerAvatar" aria-hidden="true"></div>
        <div class="who"><b id="peerName"></b><small id="peerStatus"></small></div>
      </div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="composer" id="composer">
        <input type="file" id="file" hidden>
        <div class="field">
        <button class="icon-btn" type="button" id="attachBtn" title="Attach" aria-label="Attach file">
          <svg viewBox="0 0 24 24"><path d="M1.816 15.556v.002c0 1.502.584 2.912 1.646 3.972s2.472 1.647 3.974 1.647a5.58 5.58 0 0 0 3.972-1.645l9.547-9.548c.769-.768 1.147-1.767 1.058-2.817-.079-.968-.548-1.927-1.319-2.698-1.594-1.592-4.068-1.711-5.517-.262l-7.916 7.915c-.881.881-.792 2.25.214 3.261.959.958 2.423 1.053 3.263.215l5.511-5.512c.28-.28.267-.722.053-.936l-.244-.244c-.191-.191-.567-.349-.957.04l-5.506 5.506c-.18.18-.635.127-.976-.214-.098-.097-.576-.613-.213-.973l7.915-7.917c.818-.817 2.267-.699 3.23.262.5.501.802 1.1.849 1.685.051.573-.156 1.111-.589 1.543l-9.547 9.549a3.97 3.97 0 0 1-2.829 1.171 3.975 3.975 0 0 1-2.83-1.173 3.973 3.973 0 0 1-1.172-2.828c0-1.071.415-2.076 1.172-2.83l7.209-7.211c.157-.157.264-.579.028-.814L11.5 4.36a.572.572 0 0 0-.834.018l-7.205 7.207a5.577 5.577 0 0 0-1.645 3.971z"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Type a message" aria-label="Type a message"></textarea>
        </div>
        <button class="icon-btn send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M1.101 21.757 23.8 12.028 1.101 2.3l.011 7.912 13.623 1.816-13.623 1.817-.011 7.912z"/></svg>
        </button>
      </form>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>
</div>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var state = {
    me: null, convs: [], byPeer: {}, active: null,
    msgs: {},      // peer -> [message] (chronological)
    cursor: {},    // peer -> {first, complete}
    unread: {}, loaded: {}, seen: {}
  };
  var COLORS = ['#6366f1', '#0ea5e9', '#ec4899', '#8b5cf6', '#f59e0b', '#14b8a6', '#ef4444', '#3b82f6'];
  var DOMAIN = '';

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = 'same-origin';
    opts.headers = Object.assign({ Accept: 'application/json' }, opts.headers || {});
    return fetch('/api/chat' + path, opts).then(function (r) {
      if (r.status === 401) { location.href = '/login?tab=user'; throw new Error('auth'); }
      return r.json().then(function (j) { if (!j.success) throw new Error(j.error || 'Request failed'); return j; });
    });
  }
  function postJson(path, body) {
    return api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }
  function toast(text) {
    var t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }
  function initial(name) { var m = String(name || '?').trim().match(/[A-Za-z0-9\u0080-￿]/); return m ? m[0] : '?'; }
  function color(key) { var h = 0; for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) | 0; return COLORS[Math.abs(h) % COLORS.length]; }
  function setAvatar(el, name, key) { el.textContent = initial(name); el.style.background = color(key || name); }
  function hhmm(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function dayLabel(ts) {
    var d = new Date(ts), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
    if (dayKey(ts) === dayKey(now)) return 'Today';
    if (dayKey(ts) === dayKey(y)) return 'Yesterday';
    return d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function listTime(ts) {
    if (!ts) return '';
    if (dayKey(ts) === dayKey(Date.now())) return hhmm(ts);
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (dayKey(ts) === dayKey(y)) return 'Yesterday';
    return new Date(ts).toLocaleDateString([], { day: '2-digit', month: '2-digit', year: '2-digit' });
  }
  // Bots send attachments as "URL|size|CAPTION:text"; show the file with just its caption.
  var PIPE = /^(https?:\/\/[^\s|]+)\|\d+\|CAPTION:([\s\S]*)$/;
  function splitMsg(msg) {
    var m = PIPE.exec(msg.body || '');
    if (m) return { url: msg.oob || m[1], text: m[2].trim() };
    var url = msg.oob || (/^https?:\/\/\S+$/.test(msg.body) ? msg.body : null);
    return { url: url, text: url && msg.body === url ? '' : msg.body };
  }
  function mediaLabel(url) { var k = kindOf(url); return k === 'image' ? '📷 Photo' : k === 'video' ? '🎥 Video' : k === 'audio' ? '🎵 Audio' : '📎 File'; }
  function preview(c) {
    if (!c.lastTs) return '';
    // lastBody may start with "Sender: " in groups, so match the attachment part anywhere.
    var m = /^(.*?)(https?:\/\/[^\s|]+)(?:\|\d+\|CAPTION:([\s\S]*))?$/.exec(c.lastBody || '');
    var b = c.lastBody;
    if (m && (m[3] !== undefined || (c.lastOob && !m[1]) || (!m[1] && !/\s/.test(c.lastBody)) || (c.lastOob && /:\s$/.test(m[1])))) {
      var cap = (m[3] || '').trim().split('\n')[0];
      b = m[1] + mediaLabel(m[2]) + (cap ? ' ' + cap : '');
    }
    return (c.lastFromMe ? 'You: ' : '') + b;
  }
  function kindOf(url) {
    var m = /\.([a-z0-9]{2,5})(?:[?#].*)?$/i.exec(url || '');
    var ext = m ? m[1].toLowerCase() : '';
    if (/^(jpe?g|png|gif|webp|bmp|heic|avif)$/.test(ext)) return 'image';
    if (/^(mp4|webm|mov|m4v)$/.test(ext)) return 'video';
    if (/^(mp3|ogg|oga|opus|m4a|aac|wav|amr)$/.test(ext)) return 'audio';
    return 'file';
  }
  function isGroup(peer) { return peer.indexOf('@conference.') > 0; }
  function subtitle(peer) { return isGroup(peer) ? 'Group chat' : peer.split('@')[0]; }
  function peerName(peer) { var c = state.byPeer[peer]; return c ? c.name : peer.split('@')[0]; }

  /* ---------- sidebar ---------- */
  function renderList() {
    var q = $('search').value.trim().toLowerCase();
    var list = $('list'); list.textContent = '';
    var items = state.convs.filter(function (c) { return !q || c.name.toLowerCase().indexOf(q) >= 0 || c.peer.indexOf(q) >= 0; });
    items.forEach(function (c) { list.appendChild(convRow(c)); });
    if (q) renderSearchResults(q, items);
    else if (!items.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No chats yet. Use the new chat button to start one.'; list.appendChild(e); }
  }
  function convRow(c) {
    var b = document.createElement('button');
    b.className = 'conv' + (state.active === c.peer ? ' active' : '');
    b.setAttribute('role', 'listitem');
    var av = document.createElement('div'); av.className = 'avatar'; setAvatar(av, c.name, c.peer);
    var meta = document.createElement('div'); meta.className = 'meta';
    var r1 = document.createElement('div'); r1.className = 'row';
    var nm = document.createElement('span'); nm.className = 'name'; nm.textContent = c.name;
    var tm = document.createElement('span'); tm.className = 'time'; tm.textContent = listTime(c.lastTs);
    var un = state.unread[c.peer] || 0; if (un) tm.classList.add('unread');
    r1.append(nm, tm);
    var r2 = document.createElement('div'); r2.className = 'row';
    var ls = document.createElement('span'); ls.className = 'last'; ls.textContent = preview(c);
    r2.appendChild(ls);
    if (un) { var bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = un > 99 ? '99+' : un; r2.appendChild(bd); }
    meta.append(r1, r2); b.append(av, meta);
    b.addEventListener('click', function () { openChat(c.peer); });
    return b;
  }
  var searchSeq = 0;
  function renderSearchResults(q, existing) {
    var seq = ++searchSeq;
    api('/search?q=' + encodeURIComponent(q)).then(function (j) {
      if (seq !== searchSeq || $('search').value.trim().toLowerCase() !== q) return;
      var have = {}; existing.forEach(function (c) { have[c.peer] = 1; });
      var fresh = j.users.filter(function (u) { return !have[u.jid]; });
      if (!fresh.length) return;
      var list = $('list');
      var lab = document.createElement('div'); lab.className = 'list-label'; lab.textContent = 'Other contacts'; list.appendChild(lab);
      fresh.forEach(function (u) {
        var c = { peer: u.jid, name: u.name, lastTs: 0, lastBody: '' };
        state.byPeer[u.jid] = state.byPeer[u.jid] || c;
        list.appendChild(convRow(c));
      });
    }).catch(function () {});
  }
  function sortConvs() { state.convs.sort(function (a, b) { return (b.lastTs || 0) - (a.lastTs || 0); }); }
  function touchConv(msg) {
    var c = state.byPeer[msg.peer];
    if (!c) {
      c = { peer: msg.peer, name: msg.peer.split('@')[0], lastTs: 0, lastBody: '' };
      state.byPeer[msg.peer] = c; state.convs.push(c);
      api('/search?q=' + encodeURIComponent(c.name)).then(function (j) {
        var u = j.users.filter(function (x) { return x.jid === msg.peer; })[0];
        if (u) { c.name = u.name; renderList(); if (state.active === msg.peer) $('peerName').textContent = u.name; }
      }).catch(function () {});
    }
    if (msg.ts >= (c.lastTs || 0)) { c.lastTs = msg.ts; c.lastBody = (msg.group && !msg.fromMe && msg.sender ? msg.sender + ': ' : '') + msg.body; c.lastFromMe = msg.fromMe; c.lastOob = !!msg.oob; }
    sortConvs();
  }

  /* ---------- messages ---------- */
  function linkify(text, parent) {
    var re = /\bhttps?:\/\/[^\s<]+/gi, last = 0, m;
    while ((m = re.exec(text))) {
      var url = m[0].replace(/[.,;:!?)]+$/, '');
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = url;
      parent.appendChild(a);
      last = m.index + url.length; re.lastIndex = last;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function bubble(msg, prev) {
    var el = document.createElement('div');
    el.className = 'bubble ' + (msg.fromMe ? 'out' : 'in') + (prev && prev.fromMe === msg.fromMe && prev.sender === msg.sender ? '' : ' gap');
    el.dataset.id = msg.id;
    if (msg.group && !msg.fromMe && !(prev && !prev.fromMe && prev.sender === msg.sender)) {
      var wn = document.createElement('span'); wn.className = 'who-name'; wn.textContent = msg.sender || '';
      wn.style.color = color(msg.sender || ''); el.appendChild(wn);
    }
    var sp = splitMsg(msg), url = sp.url;
    var safeUrl = url && /^https?:\/\//i.test(url) ? url : null;
    if (safeUrl) {
      var k = kindOf(safeUrl), node;
      if (k === 'image') {
        node = document.createElement('img'); node.src = safeUrl; node.loading = 'lazy'; node.alt = 'Photo';
        node.addEventListener('click', function () { var lb = $('lightbox'); lb.firstElementChild.src = safeUrl; lb.classList.add('show'); });
      } else if (k === 'video') { node = document.createElement('video'); node.src = safeUrl; node.controls = true; node.preload = 'metadata'; }
      else if (k === 'audio') { node = document.createElement('audio'); node.src = safeUrl; node.controls = true; node.preload = 'none'; }
      else {
        node = document.createElement('a'); node.className = 'file-card'; node.href = safeUrl; node.target = '_blank'; node.rel = 'noopener noreferrer';
        node.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>';
        var sp = document.createElement('span'); var nm = decodeURIComponent((safeUrl.split('?')[0].split('/').pop() || 'File')); sp.textContent = nm; node.appendChild(sp);
      }
      el.appendChild(node);
    }
    if (!safeUrl ? msg.body : sp.text) {
      var txt = document.createElement('span'); linkify(safeUrl ? sp.text : msg.body, txt); el.appendChild(txt);
    }
    var t = document.createElement('span'); t.className = 't'; t.textContent = hhmm(msg.ts); el.appendChild(t);
    if (msg.pending) el.classList.add('pending');
    if (msg.failed) { el.classList.add('failed'); t.textContent = 'Not sent'; }
    return el;
  }
  function renderMessages(peer, keepScroll) {
    var box = $('msgs'), list = state.msgs[peer] || [];
    var prevH = box.scrollHeight, prevTop = box.scrollTop;
    box.textContent = '';
    var cur = state.cursor[peer];
    if (cur && !cur.complete) {
      var ob = document.createElement('button'); ob.className = 'older'; ob.textContent = 'Load older messages';
      ob.addEventListener('click', function () { loadMessages(peer, true); }); box.appendChild(ob);
    }
    var lastDay = '', prev = null;
    list.forEach(function (m) {
      var dk = dayKey(m.ts);
      if (dk !== lastDay) { var d = document.createElement('div'); d.className = 'day'; d.textContent = dayLabel(m.ts); box.appendChild(d); lastDay = dk; prev = null; }
      box.appendChild(bubble(m, prev)); prev = m;
    });
    if (keepScroll) box.scrollTop = box.scrollHeight - prevH + prevTop;
    else box.scrollTop = box.scrollHeight;
  }
  function addMessage(msg) {
    var arr = state.msgs[msg.peer] = state.msgs[msg.peer] || [];
    var i = arr.findIndex(function (m) { return m.id === msg.id; });
    if (i < 0 && msg.group && msg.fromMe) {
      i = arr.findIndex(function (m) { return m.pending && m.fromMe && m.body === msg.body; });
    }
    if (i >= 0) { arr[i] = Object.assign(arr[i], msg, { pending: false, failed: false }); return false; }
    arr.push(msg); arr.sort(function (a, b) { return a.ts - b.ts; });
    return true;
  }
  function loadMessages(peer, older) {
    var cur = state.cursor[peer];
    var qs = '?peer=' + encodeURIComponent(peer) + (older && cur && cur.first ? '&before=' + encodeURIComponent(cur.first) : '');
    return api('/messages' + qs).then(function (j) {
      var arr = state.msgs[peer] = state.msgs[peer] || [];
      j.messages.forEach(function (m) { if (!arr.some(function (x) { return x.id === m.id; })) arr.push(m); });
      arr.sort(function (a, b) { return a.ts - b.ts; });
      state.cursor[peer] = { first: j.first, complete: j.complete || !j.first };
      state.loaded[peer] = true;
      if (state.active === peer) renderMessages(peer, older);
    }).catch(function (e) { toast('Could not load messages: ' + e.message); });
  }

  function openChat(peer) {
    state.active = peer; state.unread[peer] = 0;
    var name = peerName(peer);
    $('peerName').textContent = name; $('peerStatus').textContent = subtitle(peer);
    setAvatar($('peerAvatar'), name, peer);
    $('main').classList.add('open'); $('app').classList.add('in-chat');
    document.title = 'TBI Messenger Web';
    renderList();
    if (state.loaded[peer]) renderMessages(peer); else { $('msgs').textContent = ''; loadMessages(peer).then(function () { $('input').focus(); }); }
    $('input').focus();
  }
  function closeChat() { state.active = null; $('main').classList.remove('open'); $('app').classList.remove('in-chat'); renderList(); }

  /* ---------- sending ---------- */
  function send(text) {
    var peer = state.active; if (!peer || !text) return;
    var tmp = { id: 'tmp-' + Date.now(), peer: peer, fromMe: true, body: text, ts: Date.now(), pending: true };
    addMessage(tmp); touchConv(tmp); renderMessages(peer); renderList();
    postJson('/send', { to: peer, body: text }).then(function (j) {
      if (isGroup(peer)) {
        setTimeout(function () { tmp.pending = false; if (state.active === peer) renderMessages(peer); }, 6000);
        return;
      }
      var arr = state.msgs[peer], i = arr.findIndex(function (m) { return m.id === tmp.id; });
      var dupe = arr.some(function (m) { return m.id === j.message.id; });
      if (dupe) { if (i >= 0) arr.splice(i, 1); } else if (i >= 0) arr[i] = j.message;
      if (state.active === peer) renderMessages(peer);
    }).catch(function (e) {
      tmp.pending = false; tmp.failed = true; if (state.active === peer) renderMessages(peer); toast('Message not sent: ' + e.message);
    });
  }
  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('input').value.trim(); if (!v) return;
    $('input').value = ''; autosize(); send(v);
  });
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('composer').requestSubmit(); }
  });
  function autosize() { var t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('input').addEventListener('input', autosize);

  $('attachBtn').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = this.files[0], peer = state.active; this.value = '';
    if (!f || !peer) return;
    if (f.size > 50 * 1024 * 1024) return toast('File is larger than 50 MB');
    toast('Uploading ' + f.name + '…');
    var fd = new FormData(); fd.append('to', peer); fd.append('file', f);
    api('/upload', { method: 'POST', body: fd }).then(function (j) {
      if (!j.message.group && addMessage(j.message)) { touchConv(j.message); }
      if (state.active === peer) renderMessages(peer); renderList(); toast('Sent');
    }).catch(function (e) { toast('Upload failed: ' + e.message); });
  });

  /* ---------- live events ---------- */
  function onIncoming(msg) {
    var fresh = addMessage(msg);
    touchConv(msg);
    if (fresh && !msg.fromMe && (state.active !== msg.peer || document.hidden)) {
      state.unread[msg.peer] = (state.unread[msg.peer] || 0) + 1;
      notify(msg);
    }
    if (state.active === msg.peer) {
      var box = $('msgs'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140 || msg.fromMe;
      renderMessages(msg.peer); if (!atBottom) { /* keep position */ }
    }
    renderList(); updateTitle();
  }
  function updateTitle() {
    var n = Object.keys(state.unread).reduce(function (s, k) { return s + (state.unread[k] || 0); }, 0);
    document.title = (n ? '(' + n + ') ' : '') + 'TBI Messenger Web';
  }
  function notify(msg) {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    try { new Notification(peerName(msg.peer), { body: msg.oob ? '📎 Attachment' : msg.body, tag: msg.peer }); } catch (_) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.active) { state.unread[state.active] = 0; renderList(); updateTitle(); }
  });
  var typingTimer;
  function connectEvents() {
    var es = new EventSource('/api/chat/events');
    es.addEventListener('ready', function () { $('conn').classList.remove('show'); });
    es.addEventListener('message', function (e) { onIncoming(JSON.parse(e.data)); });
    es.addEventListener('typing', function (e) {
      var d = JSON.parse(e.data); if (d.peer !== state.active) return;
      $('peerStatus').textContent = d.typing ? 'typing…' : subtitle(d.peer);
      clearTimeout(typingTimer); if (d.typing) typingTimer = setTimeout(function () { $('peerStatus').textContent = subtitle(d.peer); }, 6000);
    });
    es.onerror = function () { $('conn').classList.add('show'); };
    es.onopen = function () { $('conn').classList.remove('show'); };
    return es;
  }

  /* ---------- misc ---------- */
  $('search').addEventListener('input', renderList);
  $('newChatBtn').addEventListener('click', function () { var s = $('search'); s.focus(); s.placeholder = 'Type a name or number…'; });
  $('backBtn').addEventListener('click', closeChat);
  $('lightbox').addEventListener('click', function () { this.classList.remove('show'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('lightbox').classList.contains('show')) $('lightbox').classList.remove('show'); else if (state.active) closeChat();
  });

  function init() {
    api('/me').then(function (me) {
      state.me = me; $('meName').textContent = me.name; $('meJid').textContent = me.username;
      setAvatar($('meAvatar'), me.name, me.jid);
      return api('/conversations');
    }).then(function (j) {
      state.convs = j.conversations;
      j.conversations.forEach(function (c) { state.byPeer[c.peer] = c; });
      renderList(); connectEvents();
      if ('Notification' in window && Notification.permission === 'default') {
        document.addEventListener('click', function ask() { document.removeEventListener('click', ask); Notification.requestPermission(); }, { once: true });
      }
    }).catch(function (e) {
      if (e.message !== 'auth') { $('list').innerHTML = ''; var d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Could not load chats: ' + e.message; $('list').appendChild(d); }
    });
  }
  init();
})();
</script>
</body>
</html>
